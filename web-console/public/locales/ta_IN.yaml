  restore_msg: "தேர்ந்தெடுக்கப்பட்ட காப்புப் பிரதி கோப்பிலிருந்து மீட்டெடுக்க விரும்புகிறீர்களா?<br/>இந்த செயல்பாட்டிற்குப் பிறகு:<3><0>சேவையகத் தரவு <1>{{fileName}}</1> க்கு மீட்டெடுக்கப்படும்</0><1>இந்தச் செயல்பாட்டை பழைய நிலைக்குத் திருப்ப முடியாது</1><2>மீட்டெடுப்பதற்கு முன் எப்போதும் காப்புப் பிரதி எடுக்கவும்</2><3>சேவையகத்தை நீங்கள் கைமுறையாகத் தொடங்க வேண்டி வரலாம்</3></3>"
