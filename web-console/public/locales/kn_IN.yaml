  node_reset_msg: "ಆಯ್ಕೆಮಾಡಿದ ನೋಡ್‌ಗಳನ್ನು ನೀವು ಖಚಿತವಾಗಿ ಮರುಹೊಂದಿಸಲು ಬಯಸುವಿರಾ?<br/>ಈ ಕಾರ್ಯಾಚರಣೆಯ ನಂತರ:<3><0>ಸಂರಚನೆಯನ್ನು ಫ್ಯಾಕ್ಟರಿ ಸೆಟ್ಟಿಂಗ್‌ಗಳಿಗೆ ಮರುಸ್ಥಾಪಿಸಲಾಗುತ್ತದೆ.</0><1>ಆಯ್ಕೆಮಾಡಿದ ನೋಡ್(ಗಳ)ಗೆ MyController ನಿಂದ ನಿಮ್ಮ ಪ್ರವೇಶ ಕಳೆದುಹೋಗಬಹುದು!</1></3>"
