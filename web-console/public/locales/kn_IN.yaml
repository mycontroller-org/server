  reboot_nodes_msg: "ಆಯ್ಕೆಮಾಡಿದ ನೋಡ್‌ಗಳನ್ನು ನೀವು ಖಚಿತವಾಗಿ ಮರುಪ್ರಾರಂಭಿಸಲು ಬಯಸುವಿರಾ?"
  reset_msg_jwt_secret: "JWT ಸೀಕ್ರೆಟ್ ಅನ್ನು ನೀವು ಖಚಿತವಾಗಿ ಮರುಹೊಂದಿಸಲು ಬಯಸುವಿರಾ? ಈ ಕಾರ್ಯಾಚರಣೆಯ ನಂತರ, ಈ ಸರ್ವರ್‌ನಲ್ಲಿನ ಎಲ್ಲ ಅಸ್ತಿತ್ವದಲ್ಲಿರುವ ಲಾಗ್-ಇನ್ ಸೆಷನ್‌ಗಳು ಅಮಾನ್ಯವಾಗುತ್ತವೆ ಮತ್ತು ನೀವು ಲಾಗ್ ಔಟ್ ಆಗುತ್ತೀರಿ."
