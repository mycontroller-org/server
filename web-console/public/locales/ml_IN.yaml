  node_reset_heading: "സന്ധിബിന്ദു റീസെറ്റ് ചെയ്യണോ?"
  node_reset_msg: "തിരഞ്ഞെടുത്ത സന്ധിബിന്ദുക്കൾ റീസെറ്റ് ചെയ്യണോ?<br/>ഈ പ്രവർത്തനത്തിന് ശേഷം:<3><0>ക്രമീകരണം ഫാക്ടറി ക്രമീകരണം-ലേക്ക് മടങ്ങും.</0><1>തിരഞ്ഞെടുത്ത മുനകളിലേക്കുള്ള MyController ആക്സസ് നഷ്ടപ്പെട്ടേക്കാം!</1></3>"
