  reboot_nodes_msg: "തിരഞ്ഞെടുത്ത സന്ധിബിന്ദുക്കൾ റീബൂട്ട് ചെയ്യണോ?"
  reset_msg_jwt_secret: "JWT സീക്രട്ട് റീസെറ്റ് ചെയ്യണോ? ഈ പ്രവർത്തനത്തിന് ശേഷം ഈ സേവാ യന്ത്രം-ലെ എല്ലാ ലോഗിൻ സെഷനുകളും അസാധുവാകും. നിങ്ങളും ലോഗ് ഔട്ട് ചെയ്യപ്പെടും."
  reset_title_jwt_secret: JWT സീക്രട്ട് റീസെറ്റ്
  restore_heading: "പുനഃസ്ഥാപിക്കണോ?"
  restore_msg: "തിരഞ്ഞെടുത്ത ബാക്കപ്പ് ഫയലിൽ നിന്ന് റീസ്റ്റോർ ചെയ്യണോ?<br/>ഈ പ്രവർത്തനത്തിന് ശേഷം:<3><0>സേവാ യന്ത്രം ഡാറ്റ <1>{{fileName}}</1> അവസ്ഥയിലേക്ക് റീസ്റ്റോർ ചെയ്യും</0><1>ഈ പ്രവർത്തനം പഴയപടിയാക്കാനാവില്ല</1><2>റീസ്റ്റോർ ചെയ്യുന്നതിന് മുമ്പ് ബാക്കപ്പ് എടുക്കുക</2><3>സേവാ യന്ത്രം നിങ്ങൾ മാനുവലായി ആരംഭിക്കേണ്ടി വന്നേക്കാം</3></3>"
