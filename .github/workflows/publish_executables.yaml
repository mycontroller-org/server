name: publish executables
on:
  workflow_dispatch: {}
  push:
    branches: [main]
    tags: ["v*"]

jobs:
  setup:
    runs-on: ubuntu-latest

    steps:
      - name: checkout
        uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: enable yarn
        run: corepack enable && corepack prepare yarn@4.18.0 --activate

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: yarn
          cache-dependency-path: web-console/yarn.lock

      - name: build web console
        run: ./scripts/build_web_console.sh

      - name: Cache go modules
        uses: actions/cache@v6
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: build bundles
        run: ./scripts/generate_executables.sh

      - name: create build timestamp and sha file
        run: |
          cd builds
          echo `date -u +'%Y%m%d%H%M%S'` > ./build_timestamp.txt  
          echo `date -u +'%Y-%m-%dT%H:%M:%S%:z'` >> ./build_timestamp.txt
          sha256sum *.tar.gz > ./SHA256SUMS.txt
          sha256sum *.zip >> ./SHA256SUMS.txt

      - name: Update release notes and executables
        uses: softprops/action-gh-release@v3
        if: startsWith(github.ref, 'refs/tags/') # executes only for new release
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
        with:
          files: |
            builds/*.tar.gz
            builds/*.zip
            builds/build_timestamp.txt
            builds/SHA256SUMS.txt

      - name: Point development tag at this commit
        if: startsWith(github.ref, 'refs/heads/main')
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          # GitHub will not move an existing tag via target_commitish.
          if gh api "/repos/${GITHUB_REPOSITORY}/git/refs/tags/development" >/dev/null 2>&1; then
            gh api --method PATCH "/repos/${GITHUB_REPOSITORY}/git/refs/tags/development" \
              -f sha="${GITHUB_SHA}" \
              -F force=true
          else
            gh api --method POST "/repos/${GITHUB_REPOSITORY}/git/refs" \
              -f ref="refs/tags/development" \
              -f sha="${GITHUB_SHA}"
          fi

      - name: Update executables from main branch changes
        if: startsWith(github.ref, 'refs/heads/main') # executes only for changes in main
        uses: softprops/action-gh-release@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
        with:
          tag_name: development
          target_commitish: ${{ github.sha }}
          name: Development Build - Pre Release
          prerelease: true
          make_latest: false
          overwrite_files: true
          files: |
            builds/*.tar.gz
            builds/*.zip
            builds/build_timestamp.txt
            builds/SHA256SUMS.txt
