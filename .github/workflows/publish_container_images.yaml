name: publish container images
on:
  workflow_dispatch: {}
  push:
    branches: [main]
    tags: ["v*"]

jobs:
  setup:
    name: Setup
    runs-on: ubuntu-latest
    strategy:
      matrix:
        container_image: ["server", "gateway", "handler"]

    steps:
      - name: checkout
        uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v4

      - name: enable yarn
        run: corepack enable && corepack prepare yarn@4.18.0 --activate

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: yarn
          cache-dependency-path: web-console/yarn.lock

      - name: Login in to docker registry
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}
      - name: Login in to quay.io registry
        uses: docker/login-action@v4
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_TOKEN }}

      - name: Build web console
        run: ./scripts/build_web_console.sh

      - name: Cache go modules
        uses: actions/cache@v6
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Build container and push - ${{ matrix.container_image }}
        env:
          TARGET_BUILD: ${{ matrix.container_image }}
        run: ./scripts/publish_container_images.sh
